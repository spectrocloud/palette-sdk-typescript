name: Pre-merge Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-ci:
    # runs-on: ubuntu-latest
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    if: ${{ !github.event.pull_request.draft && github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
    steps:
      # If the condition above is not met, aka, the PR is not in draft status, then this step is skipped.
      # Because this step is part of the critical path, omission of this step will result in remaining CI steps not gettinge executed.
      # As of 8/8/2022 there is now way to enforce this beahvior in GitHub Actions CI.
      - run: exit 0

  build-with-latest-hapi-release:
    runs-on: ubuntu-latest
    needs: [run-ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Import Vault Credentials
        id: import-secrets
        uses: spectrocloud/palette-sdk-typescript/.github/actions/vault-credentials@main

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - uses: socketdev/action@v1
        with:
          mode: firewall

      - name: Prevent Post-Install Scripts
        run: |
          npm config set ignore-scripts true

      - name: Setup Copywrite
        uses: hashicorp/setup-copywrite@v1.1.3

      - name: Checkout HAPI Repository
        uses: actions/checkout@v7.0.1
        with:
          repository: spectrocloud/hapi
          path: api/hapi
          fetch-depth: "0"
          token: ${{ steps.import-secrets.outputs.VAULT_GITHUB_TOKEN }}

      - name: Install dependencies
        run: sfw npm ci

      # esbuild's postinstall is skipped when ignore-scripts is true; Orval needs the native binary.
      # Invoking install.js directly runs only esbuild's installer (not other packages' scripts).
      - name: Install esbuild platform binary
        run: node node_modules/esbuild/install.js

      - name: Install Go Swagger
        run: |
          dir=$(mktemp -d) 
          download_url=$(\
            curl -s https://api.github.com/repos/go-swagger/go-swagger/releases/latest | \
            jq -r --arg arch $(arch) --arg os $(uname -o |cut -d'/' -f 2) '.assets[] | select(.name | test($os+"_"+$arch+"\\.tar\\.gz$"))|.browser_download_url' \
          )
          curl -o "$dir"/swagger.tar.gz -L'#' "$download_url"
          (cd "$dir" && tar xvf swagger.tar.gz swagger)
          sudo install "$dir"/swagger /usr/local/bin
          /usr/local/bin/swagger version

      - name: Ensure Reviewable
        run: make check-diff

      - name: Generate
        run: make generate

      - name: Test
        env:
          # Expires 2026-12-31. Tenant is https://palette-ai-rsch.console.spectrocloud.com/
          PALETTE_API_KEY: ${{ secrets.PALETTE_API_KEY }}
        run: make test
